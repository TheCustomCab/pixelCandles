; pixelCandles firmware for the QuinLED Dig-Next-2
; WLED 16.0.1 + PowerManager (Dig-Next-2 output relays) + candle_flame
;
; Based on the official Dig-Next-2 environment in intermittech/wled-usermod-powermanager
; (examples/platformio_override.ini), with these changes:
;   - audioreactive and sht usermods dropped (mic/temperature not used). This also keeps
;     candle_flame the only palette-registering usermod, so its palette IDs stay fixed (255 down).
;   - LED defaults set for the candles: two SK6812 RGBW outputs, 12 + 11 pixels.
;     (Only used on a fresh/erased board; existing settings override them.)
;
; Copy this file into the root of a WLED v16.0.1 checkout, and copy usermods/candle_flame
; into WLED/usermods/. Then: pio run -e dig-next-2-candles

[platformio]
default_envs = dig-next-2-candles

[env:dig-next-2-candles]
extends = env:esp32dev
upload_speed = 115200   ; the board's CH340 USB chip is unreliable at 460800/921600
custom_usermods =
  candle_flame
  https://github.com/intermittech/wled-usermod-powermanager.git#c7d92255a8c5106ac9abb9ab504967a287f36510
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0            ;; mandatory for classic ESP32 on arduino-esp32 >=2.0.3
  -D BOARD_HAS_PSRAM
  -D WLED_DISABLE_LOXONE
  -D WLED_PRODUCT_NAME=\"Dig-Next-2\"
  -D WLED_RELEASE_NAME=\"Dig-Next-2_Candles\"
  -D SERVERNAME=\"Candles\"
  -D WLED_BRAND=\"QuinLED\"
  -D WLED_AUTOSEGMENTS                   ;; one segment per output (one per candle string)
  -D DATA_PINS="2,4"                      ;; LED1 = string A, LED2 = string B
  -D PIXEL_COUNTS="12,11"
  -D LED_TYPES="30,30"                    ;; TYPE_SK6812_RGBW
  -D ABL_MILLIAMPS_DEFAULT=2000          ;; ~1 A per string budget
  -D BTNPIN=34,35,-1,-1                  ;; Button_1, Button_2 (HW debounced, pulled high)
  -D BTNTYPE=BTN_TYPE_PUSH,BTN_TYPE_PUSH,BTN_TYPE_PUSH,BTN_TYPE_PUSH
  -D I2CSDAPIN=15
  -D I2CSCLPIN=14
  -D POWERMANAGER_TAKEOVER=true          ;; outputs without a role stay off
  -D POWERMANAGER_MAX_RELAYS=4
  -D POWERMANAGER_MASTER=true            ;; relay 0 (External Relay) = Master AC relay (PSU trigger)
  -D POWERMANAGER_MASTER_MAIN_SYNC=true
  -D POWERMANAGER_PINS=5,20,21,22        ;; External Relay, 5A_1, 10A_1, 5A_2
  -D POWERMANAGER_NAMES='"External Relay","5A_1","10A_1","5A_2"'
board_build.partitions = ${esp32.large_partitions}
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.flash_mode = dio
monitor_filters = esp32_exception_decoder
